name: release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.3
      - name: tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: zmx/build.sh
      - run: cargo build --release --target "$TARGET"
      - name: upload the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/foster" zmx/out/foster-zmx dist/
          cp zmx/out/LICENSE dist/LICENSE-zmx
          tar -czf "foster-$TARGET.tar.gz" -C dist foster foster-zmx LICENSE-zmx
          gh release upload "$TAG" "foster-$TARGET.tar.gz" --clobber

  formula:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: read the version and the checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p foster-aarch64-apple-darwin.tar.gz
          {
            echo "VERSION=${TAG#v}"
            echo "SHA=$(sha256sum foster-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)"
          } >>"$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          repository: pkarpovich/homebrew-apps
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: write the formula
        run: |
          cat > tap/Formula/foster.rb <<FORMULA
          class Foster < Formula
            desc "Process registry with PTY attach for long-running commands"
            homepage "https://github.com/pkarpovich/foster"
            url "https://github.com/pkarpovich/foster/releases/download/v${VERSION}/foster-aarch64-apple-darwin.tar.gz"
            sha256 "${SHA}"

            livecheck do
              url :stable
              strategy :github_latest
            end

            depends_on arch: :arm64
            depends_on :macos

            def install
              bin.install "foster", "foster-zmx"
              prefix.install "LICENSE-zmx"
            end

            test do
              assert_match "foster restore", shell_output("#{bin}/foster help")
            end
          end
          FORMULA
      - name: commit and push the formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "foster ${VERSION}"
          git push
